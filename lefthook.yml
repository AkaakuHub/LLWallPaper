lefthook: tools/lefthook/lefthook.exe

pre-commit:
  jobs:
    - name: csharpier-check
      glob: "**/*.{cs,csproj,xaml}"
      run: dotnet tool run csharpier -- check {staged_files}

    - name: dotnet-lint
      glob: "**/*.{cs,csproj,xaml}"
      run: dotnet build LLWallPaper.sln

    - name: swift-format-check
      glob: "LLWallPaper.Mac/**/*.swift"
      run: xcrun swift-format lint --strict --recursive --configuration .swift-format LLWallPaper.Mac/Sources LLWallPaper.Mac/Tests

    - name: swift-test
      glob: "LLWallPaper.Mac/**"
      run: cd LLWallPaper.Mac && swift test
