name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "release version without leading v"
        required: true
        default: "0.0.0-manual"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (exe) on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart('v')
          }
          "value=$version" >> $Env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LLWallPaper.sln

      - name: Publish (self-contained)
        run: >-
          dotnet publish .\LLWallPaper.App\LLWallPaper.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      - name: Remove PDBs
        shell: pwsh
        run: |
          $publish = 'publish'
          Get-ChildItem -Path $publish -Filter *.pdb -Recurse | Remove-Item -Force

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 0.0.1298

      - name: Download previous releases (for delta)
        shell: pwsh
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack Velopack release
        shell: pwsh
        run: >-
          vpk pack
          --packId LLWallPaper
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish
          --mainExe LLWallPaper.App.exe

      - name: Upload Velopack release to GitHub
        shell: pwsh
        run: >-
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "v${{ steps.version.outputs.value }}"
          --tag v${{ steps.version.outputs.value }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:LLWALLPAPER_VERSION = "${{ steps.version.outputs.value }}"
          .\installer\windows\build-installer.ps1

      - name: Upload Windows installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload
          "v${{ steps.version.outputs.value }}"
          "installer/windows/Output/LLWallPaper-Installer.exe"
          --clobber

  build-macos:
    name: Build (app) on macOS
    needs: build-windows
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Format check
        run: xcrun swift-format lint --strict --recursive --configuration .swift-format LLWallPaper.Mac/Sources LLWallPaper.Mac/Tests

      - name: Test
        run: swift test
        working-directory: LLWallPaper.Mac

      - name: Build macOS app bundle
        run: ./installer/macos/build-app.sh "${{ steps.version.outputs.value }}"

      - name: Upload macOS artifact to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload
          "v${{ steps.version.outputs.value }}"
          "dist/LLWallPaper-macOS-${{ steps.version.outputs.value }}.dmg"
          --clobber
